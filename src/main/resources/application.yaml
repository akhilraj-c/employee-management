server:
  port: 8081

spring:
  application:
    name: employee-management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/employee_management}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never # always (to create and insert data always in run)

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false